# Port of the upstream gsi-port-ci.yml pipeline to GitHub Actions.
# Same three stages: build -> devel-flashable / flashable, plus a release job
# because GitHub artifacts expire and are zipped; the images are published as
# release assets instead.
name: build

# Manual only: a full run is ~2h of compute, and most pushes here touch
# overlay files that no build depends on.
on:
  workflow_dispatch:
    inputs:
      flashable:
        description: "Also build system.img from the latest devel OTA (the manual 'flashable' stage)"
        type: boolean
        default: false
      publish_run_id:
        description: "Publish an earlier run's artifacts instead of building (run id)"
        required: false
        default: ""

# One build per branch: the kernel plus 18 module trees is a ~2h job, no point
# running two of them for two pushes a minute apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ADAPTATION_TOOLS_BRANCH: personal/notkit/build-kleaf-modules

jobs:
  build:
    if: inputs.publish_run_id == ''
    # jammy to match `image: ubuntu:22.04` upstream: noble has neither
    # libtinfo5 nor python2, both of which the kernel build tools want.
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # The runner ships with ~25 GB of toolchains we never use, and the
      # kernel plus module trees plus the 4.5G rootfs image do not fit without
      # them gone.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl fakeroot flex \
            git kmod libelf-dev libssl-dev libtinfo5 lz4 python2 python3 \
            rsync sudo unzip wget xz-utils pahole libbpf-dev ccache
          sudo ln -sf python2 /usr/bin/python

      # Kernel plus 18 module trees is ~35 min of clang, nearly all of it
      # unchanged between runs: the sources come from pinned branches and only
      # this repo's config normally moves. Cannot cache the checkouts instead --
      # workdir/ is ~30 GB against a 10 GB cache limit.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # ADAPTATION_TOOLS_USE_BUILD_WRAPPER=1 upstream: our build.sh clones the
      # tools itself (BUILD_TOOLS_BRANCH) and patches them before building.
      - name: Build
        env:
          BUILD_TOOLS_BRANCH: ${{ env.ADAPTATION_TOOLS_BRANCH }}
          CCACHE_DIR: ~/.ccache
          # GitHub evicts a repo's caches past 10 GB total; leave room for the
          # older entries restore-keys falls back to.
          CCACHE_MAXSIZE: 4G
          CCACHE_COMPRESS: "1"
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/*
          retention-days: 7
          # Everything in out/ is already compressed.
          compression-level: 0

  devel-flashable:
    if: inputs.publish_run_id == ''
    runs-on: ubuntu-22.04
    needs: build
    continue-on-error: true   # allow_failure: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git img2simg jq sudo wget xz-utils zstd

      - name: Build rootfs from the device tarball
        run: |
          git clone -b "$ADAPTATION_TOOLS_BRANCH" \
            https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git build
          DEVICE="$(source ./deviceinfo && echo "$deviceinfo_codename")"
          ./build/prepare-fake-ota.sh "out/device_${DEVICE}.tar.xz" ota
          mkdir -p out
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          mv out/rootfs.img out/ubuntu.img
          zstd --ultra -22 -T0 out/ubuntu.img
          rm -f out/ubuntu.img out/system.img

      - uses: actions/upload-artifact@v4
        with:
          name: devel-flashable
          path: |
            out/*boot.img
            out/dtbo.img
            out/recovery.img
            out/ubuntu.img.zst
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  # The upstream job is `when: manual`; here it runs only when the workflow is
  # dispatched with flashable=true.
  flashable:
    if: inputs.flashable
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git img2simg jq sudo wget xz-utils

      - name: Build system.img from the latest devel OTA
        run: |
          git clone -b "$ADAPTATION_TOOLS_BRANCH" \
            https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git build
          DEVICE="$(source ./deviceinfo && echo "$deviceinfo_codename")"
          ./build/fetch-and-prepare-latest-ota.sh "20.04/arm64/android9plus/devel" "$DEVICE" ota
          mkdir -p out
          ./build/system-image-from-ota.sh ota/ubuntu_command out

      - uses: actions/upload-artifact@v4
        with:
          name: flashable
          path: |
            out/boot.img
            out/init_boot.img
            out/vendor_boot.img
            out/system.img
            out/dtbo.img
          retention-days: 7
          compression-level: 0

  release:
    runs-on: ubuntu-22.04
    needs: devel-flashable
    # Publishing an old run has no build to wait for, so the needs are skipped
    # rather than successful.
    if: always() && (inputs.publish_run_id != '' || needs.devel-flashable.result == 'success')
    permissions:
      contents: write
      actions: read
    env:
      # download-artifact takes the current run id just as happily as an old
      # one, so both paths share these steps.
      RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
      # GITHUB_TOKEN gets HTTP 403 on POST /releases in this repo even with
      # contents: write, so releases go through a PAT.
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devel-flashable
          path: release
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ github.token }}

      # Also ship the device tarball, which is what the UT installer consumes,
      # and Module.symvers for GKI debugging.
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build-out
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/checkout@v4
        with:
          path: repo

      # TWRP zip for reflashing the boot chain without the full installer.
      # zip stores update-binary's exec bit, which recovery needs.
      - name: Package the flashable zip
        run: |
          SHA="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          mkdir -p pkg/images
          cp release/boot.img release/vendor_boot.img release/dtbo.img pkg/images/
          cp -r repo/flashable/META-INF repo/flashable/README.md pkg/
          (cd pkg && zip -qr "../release/UBports-mayfly-${SHA:0:8}.zip" .)

      - name: Publish
        run: |
          cp build-out/device_*.tar.xz build-out/Module.symvers release/ 2>/dev/null || true
          # Hard link of the same tarball, no point uploading it twice.
          rm -f release/*_usrmerge.tar.xz
          ls -la release/
          # $SHA comes from the packaging step and must be the full sha: the
          # releases API rejects an abbreviated target_commitish with 422.
          TAG="ci-$RUN_ID"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG (${SHA:0:8})" \
            --notes "Halium 16 / Ubuntu Touch 24.04 build of ${SHA:0:8} (run $RUN_ID)." \
          || gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
