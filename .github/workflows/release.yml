# Publish the artifacts of an existing build run as a release, without
# rebuilding. Re-running a failed release job is not enough: a re-run keeps the
# GITHUB_TOKEN permissions the original run started with, so a run that began
# while the repo default was read-only can never get write access.
name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the build run whose artifacts to publish"
        required: true
      tag:
        description: "Release tag (default: ci-<run_id>)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devel-flashable
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      # Also ship the device tarball, which is what the UT installer consumes.
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build-out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-out/device_*.tar.xz release/ 2>/dev/null || true
          ls -la release/
          TAG="${{ inputs.tag || format('ci-{0}', inputs.run_id) }}"
          SHA="$(gh run view "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG (${SHA:0:8})" \
            --notes "Halium 16 / Ubuntu Touch 24.04 build of ${SHA:0:8} (run ${{ inputs.run_id }})." \
          || gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
