include:
  - remote: https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/raw/personal/notkit/build-kleaf-modules/gsi-port-ci.yml

variables:
  ADAPTATION_TOOLS_BRANCH: personal/notkit/build-kleaf-modules
  ADAPTATION_TOOLS_USE_BUILD_WRAPPER: "1"

# Kernel + 18 out-of-tree module trees do not finish in the default 1h.
build:
  timeout: 3h
  # Swap for `tags: [ubports]` if this port gets access to UBports' runners.
