[Service]
# The vendor audio policy lives under a per-SoC sku directory that
# pulseaudio-modules-droid does not know how to look for, so point the card
# module at it explicitly. The upstream channel for this
# (device-info get PulseaudioModulesDroid_ExtraCardArgs, read by
# get_pa_modules_droid_extra_args) is unusable here: device-info dies with the
# linker_tls.cpp:93 abort and the resulting %t/pa_modules_droid_args stays empty.
#
# "primary output" only advertises AUDIO_FORMAT_PCM_24_BIT_PACKED, which the
# droid modules cannot open ("Couldn't find compatible configuration mix port
# primary output" -> "Failed open output stream" -> no sink at all, and
# pulseaudio then aborts unloading the module). The HAL accepts 16 bit, so
# rewrite that one profile at start. Keep the edit scoped to the mixPort: the
# other three 24 bit profiles (deep_buffer, direct_pcm, record_24) are fine.
ExecStartPre=/bin/sh -c 'sed "/mixPort name=\\"primary output\\"/,/<\\/mixPort>/ s/AUDIO_FORMAT_PCM_24_BIT_PACKED/AUDIO_FORMAT_PCM_16_BIT/" /vendor/etc/audio/sku_cape/audio_policy_configuration.xml > %t/mayfly-audio-policy.xml'
Environment=PULSE_MODULES_DROID_EXTRA_CARD_ARGS=config=%t/mayfly-audio-policy.xml
