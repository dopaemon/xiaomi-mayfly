# hfd-service picks its vibrator backend once, at startup, and never again:
# VibratorBinderAidl looks up android.hardware.vibrator.IVibrator/default and,
# if the container has not registered it yet, falls back without printing an
# error -- so there is no vibration for the rest of the boot and nothing in the
# log to say why. A "systemctl restart hfd-service" fixes it every time, which
# is exactly what made haptics look like they worked in a debug session and
# then vanished across the next reboot.
#
# Ordering after lxc-android-config.service is not enough: the container went
# active at 10:54:41 on this device but the vibrator HAL only registered at
# 10:55:31, 50 s later. So poll for the service itself.
#
# The wait gives up after two minutes and starts hfd anyway -- leds, torch and
# the D-Bus name matter even on a boot where the HAL never shows up, and a
# hung hfd-service would take the UI's feedback with it.
[Unit]
After=lxc-android-config.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 120); do lxc-attach -n android -- /system/bin/service check android.hardware.vibrator.IVibrator/default 2>/dev/null | grep -q ": found" && exit 0; sleep 1; done; echo "vibrator HAL never registered; starting anyway" >&2'
TimeoutStartSec=180
