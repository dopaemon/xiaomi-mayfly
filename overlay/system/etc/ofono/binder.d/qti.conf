# Without a binder.d config, ofono-binder-plugin registers no slot at all and
# no modem ever appears -- "OfonoPlugin: binder" in the deviceinfo yaml only
# picks the plugin, it does not describe the hardware.
#
# Unlike the oneplus-11 and motorola-edge-50-pro ports, whose otherwise
# identical qti.conf says aidl on /dev/binder, mayfly's radio HAL is HIDL:
# the container registers android.hardware.radio@1.0..1.6::IRadio/slot1|slot2
# and there is no android.hardware.radio.*.IRadio* AIDL service at all. With
# InterfaceType=aidl the plugin creates both slots, finds no service, and
# waits out its 40 s start timeout in silence.
#
# Both slots have to be listed: mayfly is dual SIM and ExpectSlots gates when
# the slot manager unblocks. Verified: /ril_0 and /ril_1 come up Powered and
# Online with the two IMEIs read back over getDeviceIdentity.

[Settings]
Device = /dev/hwbinder
InterfaceType = hidl
extPlugin = qti
ExpectSlots = slot1,slot2
3GLTEHandover = false
MaxNonDataMode = none
useDataProfiles = true

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
